name: FoodDash Backend CI/CD  # Pipeline name 

on:
  push:
    branches:
      - feature/docker-cicd-1  # Triggers when you push commits to this branch

jobs:
  # JOB 1: Build and push user-service
  build-and-push-user-service:
    runs-on: ubuntu-latest  # GitHub spawns a fresh Ubuntu VM in their cloud (not your local machine)

    steps:
      # Step 1: Clone your repository code into the runner's workspace
      - name: Checkout code
        uses: actions/checkout@v3  # Without this, the runner is a blank VM with no code

      # Step 2: Authenticate GitHub Actions to your AWS account using IAM user credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}  # Reads encrypted secret from GitHub repo settings
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # Never hardcoded in workflow
          aws-region: ${{ secrets.AWS_REGION }}  # ap-south-2 (your sandbox)

      # Step 3: Login to Amazon ECR to get a push token (valid for 12 hours)
      - name: Login to Amazon ECR
        id: login-ecr  # Stores output in 'steps.login-ecr.outputs.registry'
        uses: aws-actions/amazon-ecr-login@v2  # Calls 'aws ecr get-login-password' behind the scenes

      # Step 4: Build Docker image LOCALLY on the GitHub runner (not in ECR yet)
      - name: Build user-service image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}  # Your ECR URL: 926239637076.dkr.ecr.ap-south-2.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}  # Commit SHA (e.g., abc123def456) - immutable, traceable tag
        run: |
          # Reads ./user-service/Dockerfile and builds image locally on the runner
          # Tags it with full ECR URI so Docker knows where to push
          docker build -t $ECR_REGISTRY/fooddash/user-service:$IMAGE_TAG ./user-service

      # Step 5: Push the LOCAL image to ECR (remote registry)
      - name: Push user-service to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Uploads image layers to ECR repo in ap-south-2
          # Image becomes visible in: AWS Console → ECR → ap-south-2 → fooddash/user-service
          docker push $ECR_REGISTRY/fooddash/user-service:$IMAGE_TAG

  # JOB 2: Build and push restaurant-service (runs in PARALLEL with Job 1 and Job 3)
  build-and-push-restaurant-service:
    runs-on: ubuntu-latest  # GitHub spawns a SEPARATE Ubuntu VM for this job

    steps:
      # Clone repository code (each job needs its own checkout - runners don't share filesystems)
      - name: Checkout code
        uses: actions/checkout@v3

      # Authenticate to AWS (each job needs its own authentication)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR (each job needs its own ECR login token)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build restaurant-service image locally on this job's runner
      - name: Build restaurant-service image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Reads ./restaurant-service/Dockerfile
          docker build -t $ECR_REGISTRY/fooddash/restaurant-service:$IMAGE_TAG ./restaurant-service

      # Push restaurant-service image to ECR
      - name: Push restaurant-service to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Uploads to: ECR → ap-south-2 → fooddash/restaurant-service
          docker push $ECR_REGISTRY/fooddash/restaurant-service:$IMAGE_TAG

  # JOB 3: Build and push order-service (runs in PARALLEL with Job 1 and Job 2)
  build-and-push-order-service:
    runs-on: ubuntu-latest  # GitHub spawns a THIRD separate Ubuntu VM for this job

    steps:
      # Clone repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Authenticate to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build order-service image locally on this job's runner
      - name: Build order-service image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Reads ./order-service/Dockerfile
          docker build -t $ECR_REGISTRY/fooddash/order-service:$IMAGE_TAG ./order-service

      # Push order-service image to ECR
      - name: Push order-service to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Uploads to: ECR → ap-south-2 → fooddash/order-service
          docker push $ECR_REGISTRY/fooddash/order-service:$IMAGE_TAG

  # JOB 4: Build and push frontend
  # Runs in PARALLEL with the 3 backend service build jobs (Jobs 1-3)
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      # Clone repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Authenticate to AWS (each job needs its own authentication)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR (each job needs its own ECR login token)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build frontend image locally on this job's runner
      - name: Build frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Reads ./frontend/Dockerfile
          # Frontend is a Vite + React app served on port 3000
          docker build -t $ECR_REGISTRY/fooddash/frontend:$IMAGE_TAG ./frontend

      # Push frontend image to ECR
      - name: Push frontend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Uploads to: ECR → ap-south-2 → fooddash/frontend
          docker push $ECR_REGISTRY/fooddash/frontend:$IMAGE_TAG

  # JOB 5: Deploy to EC2 via SSM Run Command
  # Runs ONLY AFTER all 4 build jobs succeed (needs: [...])
  # This is the "CD" (Continuous Deployment) part of the pipeline
  deploy:
    needs:
      - build-and-push-user-service
      - build-and-push-restaurant-service
      - build-and-push-order-service
      - build-and-push-frontend
    runs-on: ubuntu-latest

    steps:
      # Clone the repo so we have access to scripts/deploy.sh
      - name: Checkout code
        uses: actions/checkout@v3

      # Authenticate to AWS (needed for SSM Send Command + ECR login)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR (to get the registry URL for the deploy script)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Core CD step: find the EC2 instance via SSM, send the deploy script, poll for result
      - name: Deploy to EC2 via SSM Run Command
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # ── 1. Find the SSM-managed EC2 instance by tag ──
          # The ASG tags instances with Name=fooddash-asg (ASG tag overrides launch template tag)
          # So we search by Project tag which is consistent across all instances
          INSTANCE_ID=$(aws ssm describe-instance-information \
            --filter "Key=tag:Project,Values=fooddash" \
            --query 'InstanceInformationList[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No SSM-managed EC2 instance found with tag Project=fooddash"
            echo ""
            echo "Check that:"
            echo "  1. The ASG has launched an instance (desired_capacity > 0)"
            echo "  2. The SSM agent is running on the instance"
            echo "  3. The instance has the tag Project=fooddash"
            echo "  4. VPC endpoints for SSM exist (or NAT Gateway is running)"
            exit 1
          fi

          echo "Found SSM-managed instance: $INSTANCE_ID"

          # ── 2. Send SSM command directly — no file dependency ──
          # Commands are passed inline as a JSON array
          # The EC2 instance runs these commands directly via the SSM agent
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters commands="[
              \"set -e\",
              \"echo '=== FoodDash Deployment Starting ==='\",
              \"echo 'Registry: $ECR_REGISTRY'\",
              \"echo 'Tag: $IMAGE_TAG'\",
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"DB_HOST=\$(aws secretsmanager get-secret-value --secret-id fooddash/db-credentials --region $AWS_REGION --query SecretString --output text | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\\\"DB_HOST\\\"])')\",
              \"DB_USER=\$(aws secretsmanager get-secret-value --secret-id fooddash/db-credentials --region $AWS_REGION --query SecretString --output text | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\\\"DB_USER\\\"])')\",
              \"DB_PASSWORD=\$(aws secretsmanager get-secret-value --secret-id fooddash/db-credentials --region $AWS_REGION --query SecretString --output text | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\\\"DB_PASSWORD\\\"])')\",
              \"DB_NAME=\$(aws secretsmanager get-secret-value --secret-id fooddash/db-credentials --region $AWS_REGION --query SecretString --output text | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\\\"DB_NAME\\\"])')\",
              \"JWT_SECRET=\$(aws secretsmanager get-secret-value --secret-id fooddash/db-credentials --region $AWS_REGION --query SecretString --output text | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\\\"JWT_SECRET\\\"])')\",
              \"echo 'Pulling images from ECR...'\",
              \"sudo docker pull $ECR_REGISTRY/fooddash/user-service:$IMAGE_TAG\",
              \"sudo docker pull $ECR_REGISTRY/fooddash/restaurant-service:$IMAGE_TAG\",
              \"sudo docker pull $ECR_REGISTRY/fooddash/order-service:$IMAGE_TAG\",
              \"sudo docker pull $ECR_REGISTRY/fooddash/frontend:$IMAGE_TAG\",
              \"echo 'Stopping old containers...'\",
              \"sudo docker stop fooddash-user fooddash-restaurant fooddash-order fooddash-frontend 2>/dev/null || true\",
              \"sudo docker rm fooddash-user fooddash-restaurant fooddash-order fooddash-frontend 2>/dev/null || true\",
              \"echo 'Freeing ports (killing any process on 3000-3003)...'\",
              \"sudo fuser -k 3000/tcp 2>/dev/null || true\",
              \"sudo fuser -k 3001/tcp 2>/dev/null || true\",
              \"sudo fuser -k 3002/tcp 2>/dev/null || true\",
              \"sudo fuser -k 3003/tcp 2>/dev/null || true\",
              \"sudo pm2 stop all 2>/dev/null || true\",
              \"sleep 2\",
              \"echo 'Starting new containers...'\",
              \"sudo docker run -d --name fooddash-user -p 3001:3001 -e DB_HOST=\\\$DB_HOST -e DB_USER=\\\$DB_USER -e DB_PASSWORD=\\\$DB_PASSWORD -e DB_NAME=\\\$DB_NAME -e PORT=3001 -e JWT_SECRET=\\\$JWT_SECRET --restart unless-stopped $ECR_REGISTRY/fooddash/user-service:$IMAGE_TAG\",
              \"sudo docker run -d --name fooddash-restaurant -p 3002:3002 -e DB_HOST=\\\$DB_HOST -e DB_USER=\\\$DB_USER -e DB_PASSWORD=\\\$DB_PASSWORD -e DB_NAME=\\\$DB_NAME -e PORT=3002 -e JWT_SECRET=\\\$JWT_SECRET --restart unless-stopped $ECR_REGISTRY/fooddash/restaurant-service:$IMAGE_TAG\",
              \"sudo docker run -d --name fooddash-order -p 3003:3003 -e DB_HOST=\\\$DB_HOST -e DB_USER=\\\$DB_USER -e DB_PASSWORD=\\\$DB_PASSWORD -e DB_NAME=\\\$DB_NAME -e PORT=3003 -e JWT_SECRET=\\\$JWT_SECRET --restart unless-stopped $ECR_REGISTRY/fooddash/order-service:$IMAGE_TAG\",
              \"sudo docker run -d --name fooddash-frontend -p 3000:3000 --restart unless-stopped $ECR_REGISTRY/fooddash/frontend:$IMAGE_TAG\",
              \"echo 'Running health checks...'\",
              \"sleep 10\",
              \"curl -sf http://localhost:3001/health || (echo 'user-service health check FAILED' && exit 1)\",
              \"curl -sf http://localhost:3002/health || (echo 'restaurant-service health check FAILED' && exit 1)\",
              \"curl -sf http://localhost:3003/health || (echo 'order-service health check FAILED' && exit 1)\",
              \"curl -sf -o /dev/null http://localhost:3000 || (echo 'frontend health check FAILED' && exit 1)\",
              \"sudo docker image prune -f\",
              \"echo '=== Deployment Complete ==='\",
              \"echo 'Tag: $IMAGE_TAG'\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command sent: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          # ── 5. Poll for command completion (timeout: ~10 min) ──
          STATUS="InProgress"
          ATTEMPTS=0
          MAX_ATTEMPTS=60

          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ $ATTEMPTS -gt $MAX_ATTEMPTS ]; then
              echo "ERROR: Deployment timed out after $((MAX_ATTEMPTS * 10)) seconds"
              exit 1
            fi
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)
            echo "  Status: $STATUS (check $ATTEMPTS/$MAX_ATTEMPTS)"
          done

          # ── 6. Print deployment output ──
          echo ""
          echo "=== Deployment Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

          if [ "$STATUS" = "Success" ]; then
            echo ""
            echo "✓ CD pipeline complete — services deployed with tag: $IMAGE_TAG"
          else
            echo ""
            echo "✗ Deployment FAILED with status: $STATUS"
            echo "=== Error Output ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
