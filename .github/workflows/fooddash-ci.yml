# CI Pipeline for all FoodDash backend services
name: FoodDash Backend CI

# Trigger - when pushed to this branch
on:
  push:
    branches:
      - feature/docker-cicd-1   # triggers only when pushed to this branch

jobs:
  # JOB 1: User Service
  build-user-service:             # job name changed to be specific
    runs-on: ubuntu-latest        # run on GitHub ubuntu machine

    steps:
      - name: Checkout code       # download code from github onto ubuntu machine
        uses: actions/checkout@v3

      - name: Build user-service Docker image    # build from user-service/Dockerfile
        run: docker build -t user-service:${{ github.sha }} ./user-service

  # JOB 2: Restaurant Service
  build-restaurant-service:       # separate job for restaurant-service
    runs-on: ubuntu-latest        # each job gets its own ubuntu machine

    steps:
      - name: Checkout code       # each job must checkout code independently
        uses: actions/checkout@v3

      - name: Build restaurant-service Docker image   # build from restaurant-service/Dockerfile
        run: docker build -t restaurant-service:${{ github.sha }} ./restaurant-service

  # JOB 3: Order Service
  build-order-service:            # separate job for order-service
    runs-on: ubuntu-latest        # each job gets its own ubuntu machine

    steps:
      - name: Checkout code       # each job must checkout code independently
        uses: actions/checkout@v3

      - name: Build order-service Docker image    # build from order-service/Dockerfile
        run: docker build -t order-service:${{ github.sha }} ./order-service
