services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fooddash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fooddash_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fooddash"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./user-service
    environment:
      PORT: 3001
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fooddash
      JWT_SECRET: fooddash-secret
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  restaurant-service:
    build: ./restaurant-service
    environment:
      PORT: 3002
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fooddash
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy

  order-service:
    build: ./order-service
    environment:
      PORT: 3003
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fooddash
      JWT_SECRET: fooddash-secret
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - restaurant-service
      - order-service

volumes:
  fooddash_db:
